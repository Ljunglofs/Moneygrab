<!DOCTYPE html>
<html lang="sv">
<head>
<meta charset="UTF-8">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="mobile-web-app-capable" content="yes">
<meta name="theme-color" content="#080b12">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>GRABIT</title>
<link href="https://fonts.googleapis.com/css2?family=Space+Grotesk:wght@400;500;600;700&family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
<style>
:root{
  --bg:#080b12; --surface:#0e131d; --surface2:#121826;
  --line:rgba(255,255,255,.07); --line2:rgba(255,255,255,.12);
  --txt:#eef1f5; --muted:#8893a4; --dim:#5a6576;
  --blue:#3b82f6; --green:#23c87f; --gold:#eab64a; --red:#ef5168; --cyan:#22b8b8; --purple:#9b6bff;
  --disp:'Space Grotesk',sans-serif; --body:'Inter',sans-serif;
}
*{margin:0;padding:0;box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{background:var(--bg);color:var(--txt);font-family:var(--body);font-size:14px;line-height:1.5;-webkit-font-smoothing:antialiased}
body{max-width:520px;margin:0 auto;padding-bottom:80px;min-height:100vh;
  background:radial-gradient(110% 50% at 50% -5%,#0e1626 0%,transparent 55%),var(--bg)}
.num{font-family:var(--disp);font-variant-numeric:tabular-nums}
.pos{color:var(--green)} .neg{color:var(--red)}
.top{position:sticky;top:0;z-index:30;background:rgba(8,11,18,.85);backdrop-filter:blur(12px);
  border-bottom:1px solid var(--line);padding:15px 16px 13px}
.logo{font-family:var(--disp);font-weight:700;font-size:20px;letter-spacing:-.4px}
.logo .a{color:var(--gold)}
.tag{font-size:11px;color:var(--dim);margin-top:2px;letter-spacing:.04em}
.wrap{padding:16px 16px 0}
.section{margin-bottom:26px}
.sh{font-family:var(--disp);font-weight:600;font-size:16px;margin-bottom:4px}
.sub{font-size:12.5px;color:var(--dim);margin-bottom:13px}
.idx-row{display:grid;grid-template-columns:repeat(3,1fr);gap:9px;margin-bottom:22px}
.idx{background:var(--surface);border:1px solid var(--line);border-radius:12px;padding:11px 12px}
.idx .n{font-size:11px;color:var(--muted);margin-bottom:7px}
.idx .tag2{font-family:var(--disp);font-weight:700;font-size:10.5px;border-radius:6px;padding:2px 7px}
.idx .p{margin-top:8px;font-family:var(--disp);font-weight:700;font-size:14px}
.pick{background:var(--surface);border:1px solid var(--line);border-radius:16px;padding:16px;margin-bottom:12px;position:relative;overflow:hidden}
.pick::before{content:'';position:absolute;top:0;left:0;right:0;height:2px;background:var(--c)}
.pick.g{--c:var(--green)} .pick.go{--c:var(--gold)} .pick.p{--c:var(--purple)} .pick.b{--c:var(--blue)}
.kick{font-family:var(--disp);font-weight:600;font-size:10.5px;letter-spacing:.08em;text-transform:uppercase;color:var(--c);margin-bottom:11px}
.pick-top{display:flex;align-items:flex-start;justify-content:space-between}
.pick-tkr{font-family:var(--disp);font-weight:700;font-size:26px;line-height:1}
.pick-name{font-size:12px;color:var(--muted);margin-top:4px}
.pick-score{font-family:var(--disp);font-weight:700;font-size:22px;color:var(--c)}
.pick-score small{font-size:12px;color:var(--dim)}
.badges{display:flex;gap:6px;flex-wrap:wrap;margin-top:11px}
.badge{font-size:10.5px;font-weight:600;font-family:var(--disp);padding:4px 10px;border-radius:7px;background:var(--surface2);border:1px solid var(--line);color:var(--muted)}
.badge.lab{border-color:transparent}
.s4{display:flex;justify-content:space-between;padding:12px 0 2px;border-top:1px solid var(--line);margin-top:13px}
.s4 .l{font-size:9.5px;color:var(--dim);text-transform:uppercase;letter-spacing:.05em}
.s4 .v{font-family:var(--disp);font-weight:500;font-size:13px;margin-top:3px}
.bull{background:linear-gradient(180deg,#12101c,#0e131d);border:1px solid var(--line);border-radius:18px;padding:18px}
.bull .kick{color:var(--gold)}
.bull-tkr{font-family:var(--disp);font-weight:700;font-size:34px;line-height:1}
.bull-name{font-size:12.5px;color:var(--muted);margin-top:3px}
.bull-h{text-align:right}
.bull-h .l{font-size:10px;color:var(--dim);text-transform:uppercase;letter-spacing:.05em}
.bull-h .v{font-family:var(--disp);font-weight:800;font-size:38px;color:var(--gold);line-height:1}
.bull-kv{display:grid;grid-template-columns:repeat(4,1fr);gap:10px;margin-top:16px}
.bull-kv .l{font-size:9.5px;color:var(--dim);text-transform:uppercase}
.bull-kv .v{font-family:var(--disp);font-weight:700;font-size:15px;margin-top:3px}
.panel{background:var(--surface);border:1px solid var(--line);border-radius:16px;overflow:hidden}
table.hot{width:100%;border-collapse:collapse;font-size:12.5px}
.hot th{text-align:left;color:var(--dim);font-weight:500;font-size:10px;text-transform:uppercase;letter-spacing:.04em;padding:11px 12px;border-bottom:1px solid var(--line)}
.hot td{padding:11px 12px;border-bottom:1px solid var(--line)}
.hot tr:last-child td{border-bottom:0}
.hot .tkr{font-family:var(--disp);font-weight:600}
.lm{font-size:10px;font-weight:600;font-family:var(--disp);padding:2px 7px;border-radius:5px}
.lm.b{background:rgba(35,200,127,.13);color:var(--green)}
.lm.v{background:rgba(34,184,184,.13);color:var(--cyan)}
.lm.m{background:rgba(155,107,255,.13);color:var(--purple)}
.lm.a{background:rgba(234,182,74,.13);color:var(--gold)}
.heat{height:6px;border-radius:3px;background:linear-gradient(90deg,var(--gold),var(--red))}
.facts{display:grid;grid-template-columns:repeat(2,1fr);gap:10px}
.fact{background:var(--surface);border:1px solid var(--line);border-radius:13px;padding:13px}
.fact .l{font-size:11px;color:var(--muted);margin-top:8px}
.fact .v{font-family:var(--disp);font-weight:700;font-size:22px;margin-top:2px}
.fact .d{font-size:10.5px;color:var(--dim);margin-top:3px}
.tnote{padding:11px 12px;font-size:10.5px;color:var(--dim);border-top:1px solid var(--line)}
.cta{display:block;text-align:center;padding:11px;border:1px solid var(--line2);border-radius:10px;font-size:12.5px;font-weight:600;color:var(--txt);font-family:var(--disp);margin-top:13px}
.cta:active{background:var(--surface2)}
.center{text-align:center;color:var(--dim);padding:40px 0;font-size:13px}
.spin{width:22px;height:22px;border:2px solid var(--line2);border-top-color:var(--blue);border-radius:50%;animation:sp .8s linear infinite;margin:30px auto}
@keyframes sp{to{transform:rotate(360deg)}}
/* DETALJ-OVERLAY */
.ov{position:fixed;inset:0;background:var(--bg);z-index:50;max-width:520px;margin:0 auto;overflow-y:auto;display:none;padding-bottom:30px}
.ov.show{display:block}
.ov-top{position:sticky;top:0;background:rgba(8,11,18,.9);backdrop-filter:blur(12px);border-bottom:1px solid var(--line);padding:14px 16px;display:flex;align-items:center;gap:14px;z-index:2}
.ov-back{font-size:22px;color:var(--muted)}
.bar{height:7px;background:var(--surface2);border-radius:4px;overflow:hidden;margin-top:6px}
.bar i{display:block;height:100%;border-radius:4px;background:var(--blue)}
.gr{display:grid;grid-template-columns:repeat(2,1fr);gap:10px}
.box{background:var(--surface);border:1px solid var(--line);border-radius:13px;padding:14px}
.box .l{font-size:10px;color:var(--dim);text-transform:uppercase;letter-spacing:.05em;margin-bottom:7px}
.li{display:flex;gap:9px;font-size:12.5px;color:var(--muted);margin-top:7px;line-height:1.4}
.li .m{color:var(--green)} .li .w{color:var(--red)}
/* NAV */
.nav{position:fixed;left:0;right:0;bottom:0;height:64px;display:flex;background:rgba(8,11,18,.92);backdrop-filter:blur(12px);border-top:1px solid var(--line);z-index:40;max-width:520px;margin:0 auto;padding-bottom:env(safe-area-inset-bottom)}
.nav button{flex:1;background:none;border:0;color:var(--dim);font-family:var(--body);font-size:10px;font-weight:500;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:4px;cursor:pointer}
.nav button svg{width:21px;height:21px}
.nav button.on{color:var(--blue)}
</style>
</head>
<body>

<div class="top">
  <div class="logo">GR<span class="a">A</span>BIT</div>
  <div class="tag">Spot the setup. Ignore the noise.</div>
</div>

<div class="wrap" id="view"><div class="spin"></div></div>

<!-- DETALJ-OVERLAY -->
<div class="ov" id="ov">
  <div class="ov-top"><span class="ov-back" onclick="closeDetail()">←</span><div id="ov-title" style="font-family:var(--disp);font-weight:700;font-size:18px">·</div></div>
  <div class="wrap" id="ov-body"><div class="spin"></div></div>
</div>

<nav class="nav">
  <button data-v="hem" class="on"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.7" stroke-linecap="round" stroke-linejoin="round"><path d="M3 10l9-7 9 7v9a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2z"/></svg>Hem</button>
  <button data-v="marknad"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.7" stroke-linecap="round" stroke-linejoin="round"><path d="M4 18V9M9 18V5M14 18v-7M19 18V8"/></svg>Marknad</button>
  <button data-v="info"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.7" stroke-linecap="round" stroke-linejoin="round"><circle cx="12" cy="12" r="9"/><path d="M12 11v5M12 8h.01"/></svg>Info</button>
</nav>

<script>
const API = "";  // samma origin — api.py serverar denna fil
const $ = s => document.querySelector(s);
const esc = s => (s||"").replace(/[&<>"]/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));
const fmt = (n,d=2) => (n===null||n===undefined||isNaN(n)) ? "–" : Number(n).toFixed(d);
const pct = n => (n>=0?"+":"") + fmt(n,1) + "%";

function labClass(l){l=(l||"").toUpperCase();
  if(l.includes("VÄND"))return"v"; if(l.includes("MOMENT"))return"m";
  if(l==="ROCKETCASE")return"a"; return"b";}
function logo(c){const d=c&&c.domain;const t=(c&&c.name||"").slice(0,2).toUpperCase();
  return d ? `<img src="https://logo.clearbit.com/${d}" onerror="this.remove()" style="width:30px;height:30px;border-radius:8px;object-fit:contain;background:#0c1018">` : "";}

async function api(path){const r=await fetch(API+path);if(!r.ok)throw new Error(r.status);return r.json();}

// ---------- HEM ----------
async function loadHem(){
  const v=$("#view"); v.innerHTML='<div class="spin"></div>';
  let d; try{ d=await api("/api/overview"); }catch(e){ v.innerHTML=err(e); return; }
  let h="";
  // index
  h+='<div class="idx-row">';
  (d.indices||[]).forEach(x=>{
    const up=(x.pct||0)>=0, col=up?"var(--green)":"var(--red)";
    h+=`<div class="idx"><div class="n">${esc(x.name)}</div>
      <span class="tag2" style="color:${col};background:${up?'rgba(35,200,127,.12)':'rgba(239,81,104,.12)'};border:1px solid ${col}55">${esc(x.label)}</span>
      <div class="p" style="color:${col}">${pct(x.pct)}<span style="display:block;font-family:var(--body);font-weight:400;font-size:10px;color:var(--dim)">mot 200d</span></div></div>`;
  });
  h+='</div>';
  // veckans urval
  h+='<div class="section"><div class="sh">Veckans urval</div><div class="sub">Bästa lägen just nu — trend, momentum och risk/reward.</div>';
  const P=d.picks||{};
  h+=pickCard(P.dagens_setup,"Dagens setup","g");
  h+=pickCard(P.veckans_case,"Veckans case","go");
  h+=pickCard(P.wildcard,"Wildcard","p");
  h+='</div>';
  // dagens bull
  if(d.dagens_bull){const b=d.dagens_bull;
    h+=`<div class="section"><div class="bull">
      <div style="display:flex;justify-content:space-between;align-items:flex-start">
        <div><div class="kick"><span style="display:inline-block;width:7px;height:7px;border-radius:50%;background:var(--gold);margin-right:6px"></span>Dagens Bull</div>
          <div class="bull-tkr" style="margin-top:6px">${esc(b.ticker)}</div></div>
        <div class="bull-h"><div class="l">Hetta</div><div class="v">${b.hetta??"–"}</div></div></div>
      <div class="bull-kv">
        <div><div class="l">Pris</div><div class="v">${fmt(b.last)}</div></div>
        <div><div class="l">Rel.vol</div><div class="v" style="color:var(--cyan)">${fmt(b.rel_vol,1)}x</div></div>
        <div><div class="l">5d</div><div class="v ${b.ret_5>=0?'pos':'neg'}">${pct(b.ret_5)}</div></div>
        <div><div class="l">RSI</div><div class="v">${Math.round(b.rsi||0)}</div></div></div>
      <div class="cta" onclick="openDetail('${b.ticker}')">Se full analys →</div></div></div>`;
  }
  // hetast
  h+='<div class="section"><div class="sh">Hetast just nu</div><div class="sub">Starkast momentum — trendstyrka och relativ volym.</div><div class="panel"><table class="hot"><thead><tr><th>#</th><th>Ticker</th><th>Läge</th><th>Vol</th><th>5D</th><th>Poäng</th></tr></thead><tbody>';
  (d.hetast||[]).forEach((r,i)=>{
    h+=`<tr onclick="openDetail('${r.ticker}')"><td class="num">${i+1}</td>
      <td><span class="tkr">${esc(r.ticker)}</span></td>
      <td><span class="lm ${labClass(r.label)}">${esc((r.label||"").slice(0,5))}</span></td>
      <td class="num">${fmt(r.rel_vol,1)}x</td>
      <td class="num ${r.ret_5>=0?'pos':'neg'}">${pct(r.ret_5)}</td>
      <td class="num" style="color:var(--blue)">${r.score10??"–"}/10</td></tr>`;
  });
  h+='</tbody></table><div class="tnote">Skannat universum · data ~15 min fördröjd · tryck en rad för analys</div></div></div>';
  // faktorer
  const f=d.factors||{};
  h+=`<div class="section"><div class="sh">Faktoröversikt</div><div class="facts" style="margin-top:10px">
    <div class="fact"><div class="l">Träffar</div><div class="v">${f.traffar??"–"}</div><div class="d">Aktier i universum</div></div>
    <div class="fact"><div class="l">Momentum</div><div class="v" style="color:var(--purple)">${f.momentum??"–"}</div><div class="d">Momentum-läген</div></div>
    <div class="fact"><div class="l">Vändning</div><div class="v" style="color:var(--cyan)">${f.vandning??"–"}</div><div class="d">Vändningssignaler</div></div>
    <div class="fact"><div class="l">Snittpoäng</div><div class="v" style="color:var(--gold)">${f.snittpoang??"–"}</div><div class="d">Genomsnittlig kvalitet</div></div></div></div>`;
  v.innerHTML=h;
}
function pickCard(p,kick,cls){
  if(!p)return `<div class="pick ${cls}"><div class="kick">${kick}</div><div style="color:var(--dim);font-size:12.5px;padding:6px 0">Ingen kandidat matchar just nu.</div></div>`;
  return `<div class="pick ${cls}" onclick="openDetail('${p.ticker}')">
    <div class="kick">${kick}</div>
    <div class="pick-top"><div><div class="pick-tkr">${esc(p.ticker)}</div></div>
      <div class="pick-score">${p.score10??"–"}<small>/10</small></div></div>
    <div class="badges"><span class="badge lab" style="background:var(--c)22;color:var(--c)">${esc(p.label)}</span>
      <span class="badge">RSI ${Math.round(p.rsi||0)}</span></div>
    <div class="s4"><div><div class="l">Pris</div><div class="v">${fmt(p.last)}</div></div>
      <div><div class="l">5d</div><div class="v ${p.ret_5>=0?'pos':'neg'}">${pct(p.ret_5)}</div></div>
      <div><div class="l">20d</div><div class="v ${p.ret_20>=0?'pos':'neg'}">${pct(p.ret_20)}</div></div>
      <div><div class="l">Rel.vol</div><div class="v">${fmt(p.rel_vol,1)}x</div></div></div>
    <div class="cta">Se analys →</div></div>`;
}

// ---------- MARKNAD (screen) ----------
async function loadMarknad(){
  const v=$("#view"); v.innerHTML='<div class="spin"></div>';
  let d; try{ d=await api("/api/screen"); }catch(e){ v.innerHTML=err(e); return; }
  let h=`<div class="section"><div class="sh">Marknad</div><div class="sub">${d.count} träffar i universum · sorterat på poäng.</div><div class="panel"><table class="hot"><thead><tr><th>Ticker</th><th>Läge</th><th>Pris</th><th>5D</th><th>Poäng</th></tr></thead><tbody>`;
  (d.rows||[]).forEach(r=>{
    h+=`<tr onclick="openDetail('${r.ticker}')"><td><span class="tkr">${esc(r.ticker)}</span></td>
      <td><span class="lm ${labClass(r.label)}">${esc((r.label||"").slice(0,5))}</span></td>
      <td class="num">${fmt(r.last)}</td>
      <td class="num ${r.ret_5>=0?'pos':'neg'}">${pct(r.ret_5)}</td>
      <td class="num" style="color:var(--blue)">${r.score10??"–"}/10</td></tr>`;
  });
  h+='</tbody></table></div></div>';
  v.innerHTML=h;
}

// ---------- DETALJ ----------
async function openDetail(tkr){
  $("#ov").classList.add("show"); $("#ov-title").textContent=tkr;
  const b=$("#ov-body"); b.innerHTML='<div class="spin"></div>';
  window.scrollTo(0,0);
  let d; try{ d=await api("/api/stock/"+encodeURIComponent(tkr)); }catch(e){ b.innerHTML=err(e); return; }
  const a=d.analysis||{}, c=d.company||{}, ai=d.ai_score||{}, tm=d.trade_motor||{};
  let h="";
  h+=`<div style="display:flex;align-items:center;gap:12px;margin-bottom:4px">${logo(c)}
    <div><div style="font-family:var(--disp);font-weight:700;font-size:15px">${esc(c.name||tkr)}</div>
    <div style="font-size:12px;color:var(--muted)">${esc(tkr)}${c.sector?" · "+esc(c.sector):""}${c.country?" · "+esc(c.country):""}</div></div></div>`;
  h+=`<div style="display:flex;gap:22px;align-items:baseline;margin:14px 0 6px">
    <div><div style="font-family:var(--disp);font-weight:800;font-size:34px">${fmt(a.last)}</div></div>
    <div><span style="font-size:12px;color:var(--dim)">5d </span><span class="num ${a.ret_5>=0?'pos':'neg'}" style="font-weight:700">${pct(a.ret_5)}</span></div>
    <div><span style="font-size:12px;color:var(--dim)">20d </span><span class="num ${a.ret_20>=0?'pos':'neg'}" style="font-weight:700">${pct(a.ret_20)}</span></div>
    <div style="margin-left:auto;text-align:right"><div style="font-size:10px;color:var(--dim);text-transform:uppercase">Poäng</div><div style="font-family:var(--disp);font-weight:800;font-size:24px;color:var(--blue)">${a.score10??"–"}<span style="font-size:13px;color:var(--dim)">/10</span></div></div></div>`;
  h+=`<div class="badges" style="margin-bottom:14px"><span class="lm ${labClass(a.label)}" style="font-size:11px;padding:4px 10px">${esc(a.label)}</span></div>`;
  if(c.summary){const s=c.summary.length>260?c.summary.slice(0,260).replace(/\s+\S*$/,"")+"…":c.summary;
    h+=`<div style="font-size:12.5px;color:#b6c0cc;line-height:1.5;background:var(--surface);border:1px solid var(--line);border-radius:12px;padding:12px 14px;margin-bottom:16px">${esc(s)}</div>`;}
  // nyckeltal
  h+=`<div class="gr" style="margin-bottom:16px">
    <div class="box"><div class="l">RSI</div><div class="num" style="font-size:18px;font-weight:700">${Math.round(a.rsi||0)}</div></div>
    <div class="box"><div class="l">Rel.volym</div><div class="num" style="font-size:18px;font-weight:700;color:var(--cyan)">${fmt(a.rel_vol,1)}x</div></div>
    <div class="box"><div class="l">Mot topp</div><div class="num" style="font-size:18px;font-weight:700">${pct(a.pct_from_high)}</div></div>
    <div class="box"><div class="l">Volatilitet (ATR)</div><div class="num" style="font-size:18px;font-weight:700">${fmt(a.atr_pct,1)}%</div></div></div>`;
  // AI-score
  const bars=[["Teknisk",ai.technical],["Momentum",ai.momentum_score],["Sentiment",ai.sentiment],["Timing",ai.timing],["Risk",ai.risk]];
  h+=`<div class="box" style="margin-bottom:14px"><div class="l">AI-score · ${ai.ai_score??"–"}/10</div>`;
  bars.forEach(([n,val])=>{h+=`<div style="margin-top:9px"><div style="display:flex;justify-content:space-between;font-size:11.5px;color:var(--muted)"><span>${n}</span><span class="num">${val??"–"}/10</span></div><div class="bar"><i style="width:${(val||0)*10}%"></i></div></div>`;});
  h+=`</div>`;
  // trade-motor
  h+=`<div class="gr" style="margin-bottom:14px">
    <div class="box"><div class="l">Konfidens</div><div class="num" style="font-size:20px;font-weight:800;color:var(--green)">${tm.confidence??"–"}</div></div>
    <div class="box"><div class="l">Exit-risk</div><div class="num" style="font-size:20px;font-weight:800;color:${(tm.exit_risk||0)>5?'var(--red)':'var(--gold)'}">${tm.exit_risk??"–"}/10</div></div></div>`;
  if((tm.reasons||[]).length){h+=`<div class="box" style="margin-bottom:12px"><div class="l">Varför positiv</div>`;tm.reasons.forEach(r=>h+=`<div class="li"><span class="m">✓</span>${esc(r)}</div>`);h+=`</div>`;}
  if((tm.risks||[]).length){h+=`<div class="box" style="margin-bottom:12px"><div class="l">Risker</div>`;tm.risks.forEach(r=>h+=`<div class="li"><span class="w">⚠</span>${esc(r)}</div>`);h+=`</div>`;}
  h+=`<div style="font-size:11px;color:var(--dim);margin-top:8px">Teknisk signalering på pris/volym — inte finansiell rådgivning.</div>`;
  b.innerHTML=h;
}
function closeDetail(){$("#ov").classList.remove("show");}
function err(e){return `<div class="center">Kunde inte nå API:t.<br><span style="font-size:11px">${esc(String(e))}</span><br><br>Kontrollera att backend är igång.</div>`;}

// ---------- NAV ----------
const VIEWS={hem:loadHem,marknad:loadMarknad,info:()=>{$("#view").innerHTML='<div class="section"><div class="sh">Om GRABIT</div><div class="sub">Teknisk signalering på pris och volym. AI-modell som kombinerar trend, momentum och risk. Detta är analys, inte finansiell rådgivning.</div></div>';}};
document.querySelectorAll('.nav button').forEach(btn=>{
  btn.addEventListener('click',()=>{
    document.querySelectorAll('.nav button').forEach(x=>x.classList.remove('on'));
    btn.classList.add('on'); closeDetail(); (VIEWS[btn.dataset.v]||loadHem)();
  });
});
loadHem();
</script>
</body>
</html>
