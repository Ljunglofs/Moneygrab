<!DOCTYPE html>
<html lang="sv">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>GRABIT</title>
  
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Space+Grotesk:wght@400;500;600;700&display=swap" rel="stylesheet">

  <style>
    :root {
      --font-main: 'Space Grotesk', system-ui, -apple-system, sans-serif;
      --bg: #0b0e16;
      --panel: #161a23;
      --accent: #1199fa;
      --text: #eaecef;
      --muted: #848e9c;
      --pos: #16c784;
      --neg: #f6465d;
      --gold: #f0a020;
    }

    * { margin:0; padding:0; box-sizing:border-box; }
    
    body {
      font-family: var(--font-main);
      background: var(--bg);
      color: var(--text);
      padding: 16px;
      max-width: 480px;
      margin: 0 auto;
      line-height: 1.5;
    }

    .header {
      display: flex;
      justify-content: space-between;
      align-items: center;
      margin-bottom: 20px;
    }

    .logo {
      font-size: 1.9rem;
      font-weight: 800;
      letter-spacing: -1.5px;
    }

    .section {
      margin-bottom: 28px;
    }

    .section-header {
      display: flex;
      justify-content: space-between;
      align-items: center;
      margin-bottom: 12px;
    }

    .section-title {
      font-size: 1.1rem;
      font-weight: 700;
    }

    .stock-card {
      background: var(--panel);
      border: 1px solid rgba(255,255,255,0.06);
      border-radius: 18px;
      padding: 16px;
      margin-bottom: 12px;
      cursor: pointer;
      transition: transform 0.2s ease;
    }

    .stock-card:active {
      transform: scale(0.985);
    }

    .stock-header {
      display: flex;
      align-items: center;
      gap: 14px;
    }

    .logo-wrapper {
      width: 46px;
      height: 46px;
      border-radius: 11px;
      background: #0f1219;
      overflow: hidden;
      flex-shrink: 0;
      display: flex;
      align-items: center;
      justify-content: center;
      border: 1px solid rgba(255,255,255,0.08);
    }

    .stock-logo { width: 100%; height: 100%; object-fit: contain; padding: 5px; }
    
    .monogram {
      width: 100%; height: 100%;
      display: flex; align-items: center; justify-content: center;
      font-size: 16px; font-weight: 800; color: white;
    }

    .ticker { font-size: 1.1rem; font-weight: 800; }
    .company-name { font-size: 0.78rem; color: var(--muted); margin-top: 2px; }

    .price { font-size: 1.25rem; font-weight: 800; }
    .change { font-size: 0.88rem; font-weight: 700; margin-top: 2px; }
    .change.positive { color: var(--pos); }
    .change.negative { color: var(--neg); }

    .stock-footer {
      display: flex; justify-content: space-between; align-items: center;
      margin-top: 14px; padding-top: 11px; border-top: 1px solid rgba(255,255,255,0.06);
    }

    .score-badge {
      background: #1199fa22; color: #1199fa;
      padding: 3px 9px; border-radius: 999px; font-size: 0.82rem; font-weight: 700;
    }

    .meta { font-size: 0.74rem; color: var(--muted); }

    .pill {
      font-size: 0.68rem; padding: 2px 7px; border-radius: 999px; font-weight: 600;
    }
    .pill.bull { background: #16c78422; color: #16c784; }
    .pill.bear { background: #f6465d22; color: #f6465d; }
    .pill.rocket { background: #f0a02022; color: #f0a020; }

    .loading { text-align: center; color: var(--muted); padding: 30px 0; }
  </style>
</head>
<body>

  <!-- Header -->
  <div class="header">
    <div class="logo">GRABIT</div>
    <div style="color:#1199fa; font-weight:700;">PRO</div>
  </div>

  <!-- 10 HETASTE -->
  <div class="section">
    <div class="section-header">
      <div class="section-title">10 hetaste just nu</div>
    </div>
    <div id="hot-list"><div class="loading">Laddar...</div></div>
  </div>

  <!-- DAGENS BULL + VECKANS SETUP -->
  <div class="section">
    <div class="section-header">
      <div class="section-title">Dagens & Veckans</div>
    </div>
    <div style="display:grid; grid-template-columns:1fr 1fr; gap:12px;">
      <div>
        <div style="font-size:0.85rem; color:#f0a020; margin-bottom:6px; font-weight:600;">DAGENS BULL</div>
        <div id="dagens-bull"><div class="loading">Laddar...</div></div>
      </div>
      <div>
        <div style="font-size:0.85rem; color:#16c784; margin-bottom:6px; font-weight:600;">VECKANS SETUP</div>
        <div id="veckans-setup"><div class="loading">Laddar...</div></div>
      </div>
    </div>
  </div>

  <script>
    const CONFIG = {
      API_BASE: "https://grabit-api-80dh.onrender.com"
    };

    function createCard(data) {
      const chg = data.ret_5 || 0;
      const chgClass = chg >= 0 ? 'positive' : 'negative';
      const chgSign = chg >= 0 ? '+' : '';
      const labelClass = data.label === 'BULL' ? 'bull' : data.label === 'BEAR' ? 'bear' : 'rocket';

      return `
        <div class="stock-card" onclick="openDetail('${data.ticker}')">
          <div class="stock-header">
            <div class="logo-wrapper">
              <img src="https://logo.clearbit.com/${data.ticker.toLowerCase()}.com" class="stock-logo"
                   onerror="this.style.display='none'; this.nextElementSibling.style.display='flex'">
              <div class="monogram" style="display:none; background:#1199fa"><span>${data.ticker}</span></div>
            </div>
            <div style="flex:1; min-width:0">
              <div style="display:flex; align-items:center; gap:7px">
                <span class="ticker">${data.ticker}</span>
                <span class="pill ${labelClass}">${data.label}</span>
              </div>
              <div class="company-name">${data.theme || ''}</div>
            </div>
            <div style="text-align:right">
              <div class="price">${data.last ? data.last.toFixed(2) : '-'}</div>
              <div class="change ${chgClass}">${chgSign}${chg.toFixed(1)}%</div>
            </div>
          </div>
          <div class="stock-footer">
            <span class="score-badge">${data.score10 || 0}/10</span>
            <span class="meta">Vol ${data.rel_vol ? data.rel_vol.toFixed(1) : 1}×</span>
          </div>
        </div>`;
    }

    async function loadSection(endpoint, containerId) {
      const el = document.getElementById(containerId);
      el.innerHTML = '<div class="loading">Laddar...</div>';

      try {
        const res = await fetch(`${CONFIG.API_BASE}${endpoint}`);
        const data = await res.json();
        const rows = data.rows || data.hot || data.dagens_lagen || [];

        if (rows.length > 0) {
          el.innerHTML = rows.slice(0, 3).map(createCard).join('');
        } else {
          el.innerHTML = '<div class="loading">Ingen data</div>';
        }
      } catch (e) {
        el.innerHTML = '<div class="loading">Fel vid laddning</div>';
      }
    }

    async function loadHot() {
      await loadSection('/api/hot?limit=8', 'hot-list');
    }

    async function loadDagensBull() {
      await loadSection('/api/winners?limit=3', 'dagens-bull');
    }

    async function loadVeckansSetup() {
      await loadSection('/api/overview', 'veckans-setup');
    }

    async function openDetail(ticker) {
      const main = document.body;
      main.innerHTML = `<div style="padding:40px 20px; text-align:center;">Laddar ${ticker}...</div>`;

      try {
        const res = await fetch(`${CONFIG.API_BASE}/api/stock/${ticker}`);
        const data = await res.json();
        const a = data.analysis || data;

        main.innerHTML = `
          <div style="padding:20px">
            <button onclick="location.reload()" style="margin-bottom:20px; background:#222; color:#fff; border:none; padding:8px 14px; border-radius:8px;">← Tillbaka</button>
            
            <h2 style="font-size:1.6rem; margin-bottom:8px;">${ticker}</h2>
            <div style="font-size:1.1rem; color:#1199fa; margin-bottom:20px;">${a.label} • ${a.score10}/10</div>

            <div style="background:#161a23; padding:18px; border-radius:16px; margin-bottom:16px;">
              <div><strong>Pris:</strong> ${a.last ? a.last.toFixed(2) : '-'}</div>
              <div><strong>5d:</strong> ${a.ret_5 ? a.ret_5.toFixed(1) : 0}%</div>
              <div><strong>RSI:</strong> ${a.rsi ? Math.round(a.rsi) : '-'}</div>
              <div style="margin-top:12px; color:#aaa; font-size:0.9rem;">${a.forklaring || ''}</div>
            </div>

            <button onclick="location.reload()" 
                    style="width:100%; padding:14px; background:#1199fa; color:white; border:none; border-radius:12px; font-weight:700;">
              Stäng
            </button>
          </div>
        `;
      } catch (e) {
        main.innerHTML = `<div style="padding:40px 20px; text-align:center;">Kunde inte ladda ${ticker}.</div>`;
        setTimeout(() => location.reload(), 1800);
      }
    }

    // Start everything
    function init() {
      loadHot();
      loadDagensBull();
      loadVeckansSetup();
      console.log('%c[GRABIT] Full connected version loaded', 'color:#1199fa');
    }

    window.onload = init;
  </script>
</body>
</html>
