<!DOCTYPE html>
<html lang="sv">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>GRABIT v3 • Aktiescanner</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Space+Grotesk:wght@500;600;700&amp;family=Inter:wght@400;500;600&amp;display=swap">
    <style>
        @import url('https://fonts.googleapis.com/css2?family=Space+Grotesk:wght@500;600;700&amp;family=Inter:wght@400;500;600&amp;display=swap');
        
        :root {
            --accent: #2b7fff;
        }
        
        body {
            font-family: 'Inter', system_ui, sans-serif;
        }
        
        .font-display {
            font-family: 'Space Grotesk', 'Inter', system_ui, sans-serif;
            font-weight: 700;
        }

        .glass {
            background: rgba(17, 23, 38, 0.85);
            backdrop-filter: blur(20px);
            border: 1px solid rgba(255,255,255,0.08);
        }

        .stock-card {
            transition: all 0.2s cubic-bezier(0.4, 0, 0.2, 1);
        }
        
        .stock-card:hover {
            transform: translateY(-4px);
            box-shadow: 0 20px 25px -5px rgb(0 0 0 / 0.1), 0 8px 10px -6px rgb(0 0 0 / 0.1);
        }

        .section-title {
            font-family: 'Space Grotesk', sans-serif;
            font-weight: 700;
            letter-spacing: -0.025em;
        }
    </style>
</head>
<body class="bg-[#0a0d12] text-white">
    <!-- Header -->
    <div class="border-b border-white/10 bg-[#0a0d12]/95 backdrop-blur-lg sticky top-0 z-50">
        <div class="max-w-screen-2xl mx-auto px-6 py-5 flex items-center justify-between">
            <div class="flex items-center gap-x-3">
                <div class="w-9 h-9 bg-[#2b7fff] rounded-2xl flex items-center justify-center">
                    <span class="font-display text-2xl font-bold tracking-tighter">G</span>
                </div>
                <div>
                    <span class="font-display text-3xl font-bold tracking-tighter">GRABIT</span>
                    <span class="text-xs text-white/40 font-mono ml-1">v3</span>
                </div>
            </div>
            
            <div class="flex items-center gap-x-2 text-sm">
                <div class="px-3 py-1.5 bg-white/5 rounded-2xl flex items-center gap-x-2 text-xs">
                    <div class="w-2 h-2 bg-emerald-400 rounded-full animate-pulse"></div>
                    <span class="text-white/70">270 aktier</span>
                </div>
                <div onclick="window.location.reload()" 
                     class="px-4 py-1.5 bg-white/5 hover:bg-white/10 transition-colors rounded-2xl text-xs flex items-center gap-x-2 cursor-pointer">
                    <svg xmlns="http://www.w3.org/2000/svg" class="w-3.5 h-3.5" fill="none" viewBox="0 0 24 24" stroke="currentColor">
                        <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M4 4v5h.582m15.356 2A8.001 8.001 0 004.058 11H1M12 3v2m0 16v2m9-9H15m-6 0a8.001 8.001 0 01-1.297-7.5" />
                    </svg>
                    <span>Uppdatera</span>
                </div>
            </div>
        </div>
    </div>

    <div class="max-w-screen-2xl mx-auto px-6 pt-8 pb-12">
        
        <!-- Hero -->
        <div class="flex flex-col items-center text-center mb-10">
            <div class="inline-flex items-center gap-x-2 px-4 py-1 bg-white/5 rounded-3xl text-xs tracking-[1.5px] mb-4 border border-white/10">
                LIVE DATA • SVENSKA + GLOBALA AKTIER
            </div>
            <h1 class="font-display text-6xl tracking-tighter font-bold">Hitta nästa raket.</h1>
            <p class="text-xl text-white/60 mt-3 max-w-md">Teknisk analys + AI i realtid för svenska och globala aktier.</p>
        </div>

        <!-- Hetaste just nu -->
        <div class="mb-12">
            <div class="flex items-end justify-between mb-5 px-1">
                <div>
                    <div class="font-display text-3xl font-bold tracking-tight">Hetaste just nu</div>
                    <div class="text-white/50 text-sm">Topp 10 starkaste momentum just nu</div>
                </div>
                <div onclick="loadHotStocks()" 
                     class="text-xs px-4 py-2 bg-white/5 hover:bg-white/10 transition-colors rounded-2xl cursor-pointer flex items-center gap-x-2">
                    <span>Ladda om</span>
                </div>
            </div>
            
            <div id="hot-stocks" class="grid grid-cols-2 md:grid-cols-3 lg:grid-cols-5 xl:grid-cols-6 gap-4">
                <!-- Populated by JS -->
            </div>
        </div>

        <!-- Alla aktier / Sök -->
        <div>
            <div class="flex items-center justify-between mb-4 px-1">
                <div class="font-display text-3xl font-bold tracking-tight">Alla aktier</div>
                <div class="flex items-center gap-x-3">
                    <input id="search-input" 
                           type="text" 
                           placeholder="Sök ticker eller bolag..."
                           class="bg-white/5 border border-white/10 focus:border-[#2b7fff]/50 transition-colors px-5 py-2.5 rounded-3xl text-sm w-72 outline-none"
                           onkeyup="filterStocks()">
                </div>
            </div>
            
            <div id="all-stocks" class="grid grid-cols-2 md:grid-cols-3 lg:grid-cols-4 xl:grid-cols-6 2xl:grid-cols-7 gap-4">
                <!-- Populated by JS -->
            </div>
        </div>

    </div>

    <!-- Stock Detail Modal -->
    <div id="modal" onclick="if (event.target.id === 'modal') closeModal()" 
         class="hidden fixed inset-0 bg-black/70 backdrop-blur-xl z-[100] flex items-center justify-center p-4">
        <div onclick="event.stopImmediatePropagation()" 
             class="glass w-full max-w-2xl rounded-3xl border border-white/10 overflow-hidden">
            
            <!-- Modal Header -->
            <div class="px-8 pt-7 pb-5 flex items-center justify-between border-b border-white/10">
                <div class="flex items-center gap-x-4">
                    <div id="modal-logo"></div>
                    <div>
                        <div id="modal-ticker" class="font-display text-4xl font-bold tracking-tighter"></div>
                        <div id="modal-name" class="text-white/60 text-sm"></div>
                    </div>
                </div>
                <div onclick="closeModal()" class="w-9 h-9 flex items-center justify-center text-white/60 hover:text-white cursor-pointer">✕</div>
            </div>

            <div class="p-8 space-y-6">
                
                <!-- Score + Label -->
                <div class="flex items-center gap-x-4">
                    <div id="modal-score" 
                         class="text-6xl font-display font-bold tabular-nums"></div>
                    <div>
                        <div id="modal-label" 
                             class="px-5 py-1.5 rounded-2xl text-sm font-semibold inline-block"></div>
                    </div>
                </div>

                <!-- Company Info -->
                <div id="modal-company-info" class="bg-white/5 border border-white/10 rounded-2xl p-5 text-sm leading-relaxed">
                    <!-- Populated by JS -->
                </div>

                <!-- Key Metrics -->
                <div class="grid grid-cols-3 gap-3 text-sm">
                    <div class="bg-white/5 border border-white/10 rounded-2xl p-4">
                        <div class="text-white/50 text-xs tracking-widest">SENASTE PRIS</div>
                        <div id="modal-price" class="font-display text-3xl font-semibold mt-1 tabular-nums"></div>
                    </div>
                    <div class="bg-white/5 border border-white/10 rounded-2xl p-4">
                        <div class="text-white/50 text-xs tracking-widest">RSI</div>
                        <div id="modal-rsi" class="font-display text-3xl font-semibold mt-1 tabular-nums"></div>
                    </div>
                    <div class="bg-white/5 border border-white/10 rounded-2xl p-4">
                        <div class="text-white/50 text-xs tracking-widest">MOMENTUM</div>
                        <div id="modal-momentum" class="font-display text-3xl font-semibold mt-1 tabular-nums"></div>
                    </div>
                </div>

            </div>
        </div>
    </div>

    <script>
        const CONFIG = {
            API_BASE: "https://grabit-api-80dh.onrender.com"   // ← ÄNDRA TILL DIN RENDER URL
        };

        // ======================= BÄTTRE LOGO-FUNKTION =======================
        function lic(ticker, size = 42, color = "#2b7fff") {
            const t = (ticker || "").toUpperCase();
            const letter = t[0] || "?";
            
            const clearbit = `https://logo.clearbit.com/${t.toLowerCase()}.com?size=${size}`;
            
            const monogram = `
                <div style="
                    width: ${size}px; 
                    height: ${size}px; 
                    border-radius: 12px; 
                    background: linear-gradient(135deg, ${color} 0%, #1a73e8 100%);
                    display: flex; 
                    align-items: center; 
                    justify-content: center; 
                    color: white; 
                    font-weight: 700; 
                    font-size: ${size * 0.42}px; 
                    font-family: 'Space Grotesk', system-ui, sans-serif;
                    box-shadow: 0 2px 8px rgba(0,0,0,0.3);
                    flex-shrink: 0;
                ">${letter}</div>
            `;
            
            return `
                <div style="width:${size}px; height:${size}px; border-radius:12px; overflow:hidden; flex-shrink:0; background:#1a1f2e;">
                    <img src="${clearbit}" 
                         width="${size}" 
                         height="${size}" 
                         style="object-fit:cover; display:block;"
                         onerror="this.outerHTML='${monogram.replace(/'/g, "\\'")}';">
                </div>
            `;
        }

        // ======================= HJÄLPFUNKTIONER =======================
        function getScoreColor(score) {
            if (score >= 8) return '#16c784';
            if (score >= 6) return '#f5a623';
            return '#f6465d';
        }

        async function fetchHotStocks() {
            try {
                const res = await fetch(`${CONFIG.API_BASE}/api/overview`);
                const data = await res.json();
                return data.hetast || [];
            } catch (e) {
                console.error("Kunde inte hämta hetaste:", e);
                return [];
            }
        }

        async function fetchAllStocks() {
            try {
                const res = await fetch(`${CONFIG.API_BASE}/api/screen`);
                const data = await res.json();
                return data.rows || [];
            } catch (e) {
                console.error("Kunde inte hämta alla aktier:", e);
                return [];
            }
        }

        async function fetchCompanyInfo(ticker) {
            try {
                const res = await fetch(`${CONFIG.API_BASE}/api/company/${ticker}`);
                return await res.json();
            } catch (e) {
                return null;
            }
        }

        // ======================= RENDER =======================
        function renderStockCard(stock, container) {
            const div = document.createElement('div');
            div.className = `stock-card glass p-4 rounded-3xl cursor-pointer border border-white/10 hover:border-white/20`;
            
            const scoreColor = getScoreColor(stock.score10 || 0);
            
            div.innerHTML = `
                <div class="flex items-start justify-between">
                    <div class="flex items-center gap-x-3">
                        ${lic(stock.ticker, 38)}
                        <div>
                            <div class="font-display text-xl font-semibold tracking-tight">${stock.ticker}</div>
                            <div class="text-xs text-white/50 line-clamp-1">${stock.theme || ''}</div>
                        </div>
                    </div>
                    <div class="text-right">
                        <div class="font-display text-3xl font-bold tabular-nums" style="color: ${scoreColor}">
                            ${stock.score10 || '?'}
                        </div>
                        <div class="text-[10px] text-white/40 -mt-1">/10</div>
                    </div>
                </div>
                
                <div class="mt-4 flex items-center justify-between text-xs">
                    <div class="px-3 py-1 rounded-2xl text-white/80" style="background: ${scoreColor}22; color: ${scoreColor}">
                        ${stock.label || '—'}
                    </div>
                    <div class="text-white/60 tabular-nums">
                        ${(stock.last || 0).toFixed(1)}
                    </div>
                </div>
            `;
            
            div.onclick = () => openStockDetail(stock.ticker);
            container.appendChild(div);
        }

        async function loadHotStocks() {
            const container = document.getElementById('hot-stocks');
            container.innerHTML = `<div class="col-span-full text-center py-8 text-white/40">Laddar...</div>`;
            
            const stocks = await fetchHotStocks();
            container.innerHTML = '';
            
            stocks.slice(0, 12).forEach(stock => {
                renderStockCard(stock, container);
            });
        }

        let allStocksCache = [];

        async function loadAllStocks() {
            const container = document.getElementById('all-stocks');
            container.innerHTML = `<div class="col-span-full text-center py-8 text-white/40">Laddar alla aktier...</div>`;
            
            allStocksCache = await fetchAllStocks();
            container.innerHTML = '';
            
            allStocksCache.forEach(stock => {
                renderStockCard(stock, container);
            });
        }

        function filterStocks() {
            const search = document.getElementById('search-input').value.toLowerCase();
            const container = document.getElementById('all-stocks');
            container.innerHTML = '';
            
            const filtered = allStocksCache.filter(s => 
                s.ticker.toLowerCase().includes(search) || 
                (s.theme && s.theme.toLowerCase().includes(search))
            );
            
            filtered.forEach(stock => renderStockCard(stock, container));
        }

        async function openStockDetail(ticker) {
            const modal = document.getElementById('modal');
            modal.classList.remove('hidden');
            modal.classList.add('flex');

            // Reset
            document.getElementById('modal-ticker').innerText = ticker;
            document.getElementById('modal-name').innerText = 'Laddar...';
            document.getElementById('modal-logo').innerHTML = lic(ticker, 52);
            document.getElementById('modal-company-info').innerHTML = '<div class="text-white/50">Laddar bolagsinfo...</div>';

            try {
                // Hämta detaljerad data
                const res = await fetch(`${CONFIG.API_BASE}/api/stock/${ticker}`);
                const data = await res.json();
                const a = data.analysis || {};

                // Fyll i grunddata
                document.getElementById('modal-price').innerText = (a.last || 0).toFixed(2);
                document.getElementById('modal-rsi').innerText = (a.rsi || 0).toFixed(0);
                document.getElementById('modal-momentum').innerText = (a.momentum || 0).toFixed(0);
                
                const scoreEl = document.getElementById('modal-score');
                scoreEl.innerText = a.score10 || '?';
                scoreEl.style.color = getScoreColor(a.score10 || 0);

                const labelEl = document.getElementById('modal-label');
                labelEl.innerText = a.label || '—';
                labelEl.style.background = `${getScoreColor(a.score10 || 0)}22`;
                labelEl.style.color = getScoreColor(a.score10 || 0);

                // Hämta bolagsinfo
                const company = await fetchCompanyInfo(ticker);
                const infoContainer = document.getElementById('modal-company-info');
                
                if (company && company.summary) {
                    infoContainer.innerHTML = `
                        <div class="text-xs uppercase tracking-[1px] text-white/50 mb-1.5">BOLAGSINFO</div>
                        <div class="font-medium">${company.sector || 'Okänd sektor'}</div>
                        <div class="mt-3 text-sm text-white/80 leading-relaxed">${company.summary}</div>
                    `;
                } else {
                    infoContainer.innerHTML = `<div class="text-white/50 text-sm">Ingen bolagsinfo tillgänglig just nu.</div>`;
                }

            } catch (e) {
                console.error(e);
                document.getElementById('modal-company-info').innerHTML = 
                    `<div class="text-red-400 text-sm">Kunde inte ladda data. Försök igen.</div>`;
            }
        }

        function closeModal() {
            const modal = document.getElementById('modal');
            modal.classList.remove('flex');
            modal.classList.add('hidden');
        }

        // ======================= INIT =======================
        async function init() {
            await loadHotStocks();
            await loadAllStocks();
            
            // Enter key på sök
            document.getElementById('search-input').addEventListener('keypress', function(e) {
                if (e.key === 'Enter') filterStocks();
            });
        }

        window.onload = init;
    </script>
</body>
</html>
