# GEX Daily Levels — räknar dagens nivåer för NQ och GC, skickar till Telegram
# och sparar strängarna i levels/ så de går att öppna i telefonen.
#
# Schema (vardagar, UTC):
#   06:00 = 08:00 svensk sommartid -> London-uppsättning: samma väggar (OI ändras
#           bara efter USA-stängning) men EM-band och öppningsgrid centrerade på nattens pris.
#   11:05 = 13:05 svensk sommartid -> USA-uppsättning med dagens uppdaterade open interest.
#   06:30 / 11:35 = reservkörningar. GitHubs schemaläggare kan försena eller tappa
#   körningar; reserven skickar bara om ingen uppsättning gått ut senaste 50 min.
# (Vintertid: en timme tidigare svensk tid.)
# OBS: schemalagda jobb körs bara från repots default-branch (main).
# "Run workflow" (workflow_dispatch) fungerar från vilken branch som helst,
# även från GitHub-appen i telefonen.
#
# Secrets (Settings -> Secrets and variables -> Actions):
#   TELEGRAM_TOKEN  samma bot som roboten
#   CHAT_ID         din chat
name: GEX Daily Levels

on:
  schedule:
    - cron: "0 6 * * 1-5"    # London 08:00 CEST
    - cron: "30 6 * * 1-5"   # reserv (skickar bara om 08:00 inte gick)
    - cron: "5 11 * * 1-5"   # USA   13:05 CEST
    - cron: "35 11 * * 1-5"  # reserv (skickar bara om 13:05 inte gick)
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: gex-daily
  cancel-in-progress: false

jobs:
  levels:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip

      - name: Installera beroenden
        run: pip install -q yfinance pandas numpy requests

      - name: Räkna nivåer och skicka till Telegram
        env:
          TELEGRAM_TOKEN: ${{ secrets.TELEGRAM_TOKEN }}
          CHAT_ID: ${{ secrets.CHAT_ID }}
          # Schemalagda körningar hoppar över om en uppsättning gått ut senaste 50 min
          # (så reservkörningen inte dubblerar). Manuell "Run workflow" kör alltid.
          GEX_SKIP_IF_FRESHER_MIN: ${{ github.event_name == 'schedule' && '50' || '0' }}
          GEX_FORCE: ${{ github.event_name == 'workflow_dispatch' && '1' || '0' }}
        run: python gex_notify.py

      - name: Spara strängarna i repot (levels/)
        run: |
          git config user.name "gex-bot"
          git config user.email "gex-bot@users.noreply.github.com"
          git add levels/
          git diff --cached --quiet && echo "inga ändringar" || git commit -m "GEX levels $(date -u +%Y-%m-%d)"
          git push
