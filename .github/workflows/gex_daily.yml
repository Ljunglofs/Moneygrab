# GEX Daily Levels — räknar dagens nivåer för NQ och GC, skickar till Telegram
# och sparar strängarna i levels/ så de går att öppna i telefonen.
#
# Två fönster per vardag (UTC):
#   london (06:00 UTC = 08:00 svensk sommartid) -> samma väggar (OI ändras bara
#           efter USA-stängning) men EM-band och öppningsgrid på nattens pris.
#   usa    (11:05 UTC = 13:05 svensk sommartid) -> dagens uppdaterade open interest.
#   rth    (14:05 UTC = 16:05 svensk sommartid) -> en halvtimme efter USA-öppning.
#           Enda körningen som ligger inom 09:30-16:00 ET, alltså den enda som
#           kan mäta kvoten futures/ETF live och spara den i levels/ratio.json
#           åt morgondagens morgonkörning. Ger också dagens öppningsnivåer och
#           0DTE-väggar när de faktiskt betyder något.
# (Vintertid: en timme tidigare svensk tid.)
#
# GitHub startar schemalagda jobb först när det finns kapacitet — de kan bli
# timmar sena eller helt utebli. Därför har varje fönster flera starttider.
# Den första körningen som lyckas låser fönstret för dagen i levels/sent.json
# (gex_notify.py --once), resten hoppar över direkt. Blir det fel skickas ett
# felmeddelande en gång, sedan försöker följande körningar tyst igen.
#
# OBS: schemalagda jobb körs bara från repots default-branch (main).
# "Run workflow" (workflow_dispatch) fungerar från vilken branch som helst,
# även från GitHub-appen i telefonen, och skickar alltid (ignorerar låset).
#
# Secrets (Settings -> Secrets and variables -> Actions):
#   TELEGRAM_TOKEN  samma bot som roboten
#   CHAT_ID         din chat
name: GEX Daily Levels

on:
  schedule:
    - cron: "0 6 * * 1-5"     # London 08:00 CEST
    - cron: "30 6 * * 1-5"    # retry om 06:00-jobbet aldrig startade
    - cron: "0 7 * * 1-5"     # retry
    - cron: "30 7 * * 1-5"    # retry
    - cron: "0 8 * * 1-5"     # sista chansen för London-fönstret
    - cron: "5 11 * * 1-5"    # USA 13:05 CEST
    - cron: "35 11 * * 1-5"   # retry
    - cron: "5 12 * * 1-5"    # retry
    - cron: "35 12 * * 1-5"   # retry
    - cron: "5 13 * * 1-5"    # sista chansen för USA-fönstret
    - cron: "5 14 * * 1-5"    # RTH 16:05 CEST = 10:05 ET, en halvtimme efter USA-öppning
    - cron: "35 14 * * 1-5"   # retry
    - cron: "5 15 * * 1-5"    # sista chansen för RTH-fönstret
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: gex-daily
  cancel-in-progress: false

jobs:
  # Jämför källorna och skriver ut allt i loggen. Skickar ingenting.
  diag:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - name: Installera beroenden
        run: pip install -q yfinance pandas numpy requests
      - name: Spotpriser och kvoter från båda källorna
        run: python gex_check.py

  levels:
    # Manuell körning från en testbranch kör bara diagnosen ovan — inget
    # hamnar i Telegram förrän koden ligger på main.
    if: github.event_name == 'schedule' || github.ref_name == 'main'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip

      - name: Installera beroenden
        run: pip install -q yfinance pandas numpy requests

      - name: Räkna nivåer och skicka till Telegram
        env:
          TELEGRAM_TOKEN: ${{ secrets.TELEGRAM_TOKEN }}
          CHAT_ID: ${{ secrets.CHAT_ID }}
          EVENT: ${{ github.event_name }}
        run: |
          # Fönstret avgörs av när jobbet faktiskt kör, inte av vilken cron som
          # startade det. Gränsen ligger på 11:00 UTC: London-cronerna går
          # 06:00-08:00 och USA-cronerna 11:05-13:05, så en London-körning som
          # GitHub skjuter upp flera timmar räknas fortfarande som London i
          # stället för att låsa USA-fönstret i förtid.
          H=$(date -u +%H)
          if [ "$H" -lt 11 ]; then W=london; elif [ "$H" -lt 14 ]; then W=usa; else W=rth; fi
          echo "Fönster: $W"
          # manuell körning skickar alltid, men låser fönstret så schemat inte dubblar
          [ "$EVENT" = "workflow_dispatch" ] && MODE=--force || MODE=--once
          set +e
          python gex_notify.py --window "$W" "$MODE" 2>&1 | tee /tmp/gex.log
          rc=${PIPESTATUS[0]}
          # gick något meddelande iväg behövs inget extra larm nedan
          grep -q "Telegram: skickat" /tmp/gex.log && echo "notified=1" >> "$GITHUB_ENV"
          exit $rc

      - name: Spara strängarna i repot (levels/)
        if: always()
        run: |
          git config user.name "gex-bot"
          git config user.email "gex-bot@users.noreply.github.com"
          git add levels/
          git diff --cached --quiet && { echo "inga ändringar"; exit 0; }
          git commit -m "GEX levels $(date -u +%Y-%m-%d)"
          for i in 1 2 3; do
            git push && exit 0
            echo "push misslyckades — hämtar och försöker igen ($i)"
            git pull --rebase origin "${GITHUB_REF_NAME}" || exit 1
            sleep $((i * 5))
          done
          git push

      - name: Larma på Telegram om körningen sprack utan att hinna säga till
        if: failure() && env.notified != '1'
        env:
          TELEGRAM_TOKEN: ${{ secrets.TELEGRAM_TOKEN }}
          CHAT_ID: ${{ secrets.CHAT_ID }}
          RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
        run: |
          [ -n "$TELEGRAM_TOKEN" ] && [ -n "$CHAT_ID" ] || exit 0
          curl -sS -X POST "https://api.telegram.org/bot${TELEGRAM_TOKEN}/sendMessage" \
            -d chat_id="$CHAT_ID" \
            -d disable_web_page_preview=true \
            --data-urlencode "text=⚠ GEX Daily Levels sprack — inga nivåer denna körning. Logg: ${RUN_URL}" >/dev/null
