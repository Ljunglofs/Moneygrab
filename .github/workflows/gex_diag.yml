# GEX-diagnos — kör nivåberäkningen mot båda källorna och skriver ut allt i
# loggen. Skickar ingenting till Telegram och rör inga filer i repot.
# Actions -> GEX Diagnos -> Run workflow (välj branch).
name: GEX Diagnos

on:
  workflow_dispatch:

jobs:
  diag:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - name: Installera beroenden
        run: pip install -q yfinance pandas numpy requests

      - name: CBOE
        env:
          GEX_SOURCE: cboe
          DATA_DIR: /tmp/cboe
        run: python gex_cli.py

      - name: Yahoo
        if: always()
        env:
          GEX_SOURCE: yahoo
          DATA_DIR: /tmp/yahoo
        run: python gex_cli.py

      - name: Råa spotpriser från båda hållen
        if: always()
        run: |
          python - <<'PY'
          import requests, yfinance as yf
          for etf, fut in (("QQQ", "NQ=F"), ("GLD", "GC=F")):
              try:
                  d = requests.get(f"https://cdn.cboe.com/api/global/delayed_quotes/options/{etf}.json",
                                   timeout=30, headers={"User-Agent": "grabit-gex/1.0"}).json()["data"]
                  cboe = float(d.get("current_price") or 0)
                  n = sum(1 for o in d.get("options") or [] if (o.get("open_interest") or 0) > 0)
              except Exception as e:
                  cboe, n = f"fel: {e}", 0
              t = yf.Ticker(etf)
              try:
                  yah = float(t.fast_info.get("last_price") or 0)
              except Exception as e:
                  yah = f"fel: {e}"
              try:
                  hist = float(t.history(period="1d", interval="5m")["Close"].iloc[-1])
              except Exception as e:
                  hist = f"fel: {e}"
              f = yf.Ticker(fut)
              try:
                  futpx = float(f.fast_info.get("last_price") or 0)
              except Exception as e:
                  futpx = f"fel: {e}"
              print(f"{etf}: cboe={cboe} ({n} kontrakt med OI) · yahoo fast_info={yah} · yahoo 5m-bar={hist} · {fut}={futpx}")
              for name, spot in (("cboe", cboe), ("yf fast_info", yah), ("yf 5m", hist)):
                  if isinstance(spot, float) and spot and isinstance(futpx, float):
                      print(f"    kvot med {name}: {futpx / spot:.4f}")
          PY
